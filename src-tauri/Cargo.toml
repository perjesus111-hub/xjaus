[package]
name = "xjaus-backend"
version = "1.0.0"
description = "High-performance Xbox Cloud Gaming & Remote Play client for Linux"
license = "GPL-3.0-only"
authors = ["XJAUS contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xjaus_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
keyring = "4.2"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.2"
hex = "0.4"
regex = "1"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
