name: Linux release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and package prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev rpm
      - name: Check release version matches tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm ci
      - name: Test and build real Linux artifacts
        run: npm test && npm run dist:linux
      - name: Inspect installer formats
        run: |
          file release/linux/*.AppImage
          rpm -qip release/linux/*.rpm
          dpkg-deb --info release/linux/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: XJAUS-linux-x64
          if-no-files-found: error
          path: |
            release/linux/*.AppImage
            release/linux/*.rpm
            release/linux/*.deb
            release/linux/SHA256SUMS
      - name: Upload verified artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/linux/*.AppImage
            release/linux/*.rpm
            release/linux/*.deb
            release/linux/SHA256SUMS
