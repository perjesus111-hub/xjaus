name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Electron checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Full Linux test suite
        if: runner.os == 'Linux'
        run: npm test
      - name: Nonpublishing candidate consistency tests
        if: runner.os == 'Linux'
        run: node --test scripts/verify-ci-candidate-manifest.cjs
      - name: Windows frontend and Electron tests
        if: runner.os == 'Windows'
        run: npx vitest run && node --test electron/verify-security.cjs electron/verify-icons.cjs electron/verify-windows.cjs electron/verify-window-state.cjs electron/verify-window-drag.cjs
      - name: Linux frontend build
        if: runner.os == 'Linux'
        run: npm run build
      # The npm copy-login script is POSIX-only; reproduce its file copy
      # using PowerShell, then verify the resulting bundled login asset.
      - name: Windows frontend compilation and bundle
        if: runner.os == 'Windows'
        run: |
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item public/login.html dist/login.html -ErrorAction Stop
          if ((Get-FileHash public/login.html).Hash -ne (Get-FileHash dist/login.html).Hash) { throw 'login asset mismatch' }

  linux-backend:
    name: Linux backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin xjaus_backend
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          TMPDIR: ${{ runner.temp }}

  windows-backend:
    name: Windows backend build and tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path backend-windows/Cargo.toml --bin xjaus_backend
      - run: cargo test --locked --manifest-path backend-windows/Cargo.toml
