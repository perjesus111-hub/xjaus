name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The repository's UI tests assert the supported Spanish fallback strings.
# Rust settings tests require an explicit writable temporary directory.
env:
  LANG: es_MX.UTF-8
  LC_ALL: es_MX.UTF-8
  TMPDIR: ${{ runner.temp }}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Renderer checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust-sidecar:
    name: Rust sidecar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev pkg-config
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Check sidecar
        run: cargo +stable check --locked --manifest-path src-tauri/Cargo.toml --bin xjaus_backend
      - name: Test sidecar
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml --bin xjaus_backend